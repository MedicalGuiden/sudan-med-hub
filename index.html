
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12345a">
<meta name="description" content="Sudan Med Hub - Medical learning and MCQs.">
<link rel="manifest" href="./manifest.json">
<title>Sudan Med Hub</title>

<style>
*{box-sizing:border-box}
body{
margin:0;font-family:Arial,sans-serif;
background:#f3f6fa;color:#18324d
}
header{
background:#12345a;color:white;
text-align:center;padding:35px 15px
}
header h1{margin:0 0 8px}
main{max-width:750px;margin:25px auto;padding:16px}
.search{
width:100%;padding:15px;
border:1px solid #ccd6e2;
border-radius:10px;font-size:16px
}
.grid{
display:grid;grid-template-columns:1fr 1fr;
gap:14px;margin-top:22px
}
.card{
background:white;padding:25px 12px;
border-radius:12px;text-align:center;
box-shadow:0 2px 12px #0000000d;
cursor:pointer;transition:.2s
}
.card:active{transform:scale(.97)}
.card h3{margin:10px 0 5px}
.card p{font-size:13px;color:#64748b}
.emoji{font-size:30px}
footer{
text-align:center;padding:25px;
color:#64748b;font-size:13px
}
.hidden{display:none!important}
.back{
background:#12345a;color:white;border:0;
padding:11px 18px;border-radius:8px;
font-size:15px;margin-bottom:18px;cursor:pointer
}
.post{
background:white;padding:17px;
border-radius:10px;margin:12px 0;
box-shadow:0 2px 8px #0000000d
}
.post h3{margin:0 0 8px;font-size:16px}
.post a{color:#12345a;text-decoration:none;font-weight:bold}
.post small{color:#64748b}
.status{text-align:center;padding:25px;color:#64748b}
</style>
</head>

<body>

<header>
<h1>Sudan Med Hub</h1>
<p>Learn • Practice • Excel.</p>
</header>

<main>

<section id="home">
<input class="search" id="homeSearch"
type="search" placeholder="Search medical topics...">

<div class="grid" id="categories">

<div class="card">
<div class="emoji">📚</div>
<h3>Medicine</h3>
<p>Medical articles</p>
</div>

<div class="card" onclick="openMCQs()">
<div class="emoji">📝</div>
<h3>MCQs</h3>
<p>Test your knowledge</p>
</div>

<div class="card">
<div class="emoji">🔬</div>
<h3>Research</h3>
<p>Research learning</p>
</div>

<div class="card">
<div class="emoji">💡</div>
<h3>General Knowledge</h3>
<p>Explore science</p>
</div>

</div>
</section>

<section id="mcqs" class="hidden">

<button class="back" onclick="goHome()">← Back to Home</button>

<h2>📝 Medical MCQs</h2>
<p>Explore questions from Sudan Med Hub.</p>

<input class="search" id="mcqSearch"
type="search" placeholder="Search MCQs...">

<div id="posts" class="status">
Loading medical questions...
</div>

</section>
</main>

<footer>Sudan Med Hub © 2026</footer>

<script>

function openMCQs(){
document.getElementById("home").classList.add("hidden");
document.getElementById("mcqs").classList.remove("hidden");
loadMCQs();
}

function goHome(){
document.getElementById("mcqs").classList.add("hidden");
document.getElementById("home").classList.remove("hidden");
}

let loaded=false;
let allPosts=[];

function loadMCQs(){

if(loaded){
renderPosts(allPosts);
return;
}

const output=document.getElementById("posts");
output.innerHTML="Loading questions...";

window.handleBloggerFeed=function(data){

const entries=data.feed.entry||[];

allPosts=entries.map(entry=>{
const link=entry.link.find(item=>item.rel==="alternate");

return {
title:entry.title.$t,
date:entry.published.$t,
url:link?link.href:"#"
};
});

loaded=true;
renderPosts(allPosts);

};

const script=document.createElement("script");

script.src=
"https://sudanmedic.blogspot.com/feeds/posts/default/-/MCQs?alt=json-in-script&max-results=50&callback=handleBloggerFeed";

script.onerror=function(){
output.innerHTML="Unable to load MCQs. Check your internet connection.";
};

document.body.appendChild(script);
}

function renderPosts(posts){

const output=document.getElementById("posts");

if(!posts.length){
output.innerHTML="No MCQs posts found.";
return;
}

output.innerHTML="";

posts.forEach(post=>{

const item=document.createElement("div");
item.className="post";

const title=document.createElement("h3");
title.textContent=post.title;

const date=document.createElement("small");
date.textContent=new Date(post.date).toLocaleDateString();

const link=document.createElement("a");
link.href=post.url;
link.target="_blank";
link.rel="noopener";
link.textContent="Read Questions →";

item.append(title,date,document.createElement("br"),link);
output.appendChild(item);

});
}

document.getElementById("mcqSearch")
.addEventListener("input",function(){

const query=this.value.toLowerCase();

renderPosts(allPosts.filter(post=>
post.title.toLowerCase().includes(query)
));

});

document.getElementById("homeSearch")
.addEventListener("input",function(){

const query=this.value.toLowerCase();

document.querySelectorAll("#categories .card")
.forEach(card=>{
card.style.display=
card.innerText.toLowerCase().includes(query)
?"block":"none";
});

});

if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("./service-worker.js")
.catch(console.error);
});
}

</script>
</body>
</html>
